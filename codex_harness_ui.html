<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Harness</title><style>:root{color-scheme:dark;--bg:#111416;--panel:#191d20;--line:#30373c;--text:#e6eaed;--muted:#9da8ae;--accent:#5ee0b0;--warn:#f4c66b;--bad:#ff7b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr}header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}h1{font-size:15px;margin:0}.grow{flex:1}.badge{padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.ok{color:var(--accent)}.bad{color:var(--bad)}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;padding:10px}.chat,.side{min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.chat{display:grid;grid-template-rows:1fr auto}.side{overflow:auto;padding:12px}#stream{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.event{white-space:pre-wrap;overflow-wrap:anywhere;padding:9px 11px;border-left:3px solid var(--line);background:#14181a;border-radius:4px}.user{border-color:#65a8ff}.assistant{border-color:var(--accent)}.approval{border-color:var(--warn)}.diagnostic{color:var(--muted);font-family:monospace;font-size:12px}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}.approval-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.composer{padding:10px;border-top:1px solid var(--line)}textarea{width:100%;min-height:92px;resize:vertical;background:#101315;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit}.controls,.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}button,select{background:#252b2f;color:var(--text);border:1px solid #3b444a;border-radius:5px;padding:7px 9px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#17694f;border-color:#2ba77e}button.danger{color:#ffbbb6}button:disabled{opacity:.45;cursor:not-allowed}h2{font-size:13px;margin:14px 0 7px}.side h2:first-child{margin-top:0}.field{display:grid;gap:4px;margin-bottom:8px}.field label{font-size:11px;color:var(--muted)}.field select{width:100%}#details,#capabilities{font-family:monospace;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}.login{padding:9px;border:1px solid var(--warn);border-radius:6px}.hidden{display:none}.hint{color:var(--muted);font-size:12px}@media(max-width:850px){main{grid-template-columns:1fr;grid-template-rows:minmax(500px,1fr) auto}.side{max-height:45vh}}</style></head><body><header><h1>Codex Harness</h1><span id="serverBadge" class="badge">connecting</span><span id="turnBadge" class="badge">idle</span><span class="grow"></span><span id="root" class="hint"></span></header><main><section class="chat"><div id="stream" aria-live="polite"></div><div class="composer"><textarea id="prompt" placeholder="Ask Codex to inspect, explain, or change this workspace…"></textarea><div class="controls"><button id="send" class="primary">Send</button><button id="interrupt" class="danger">Interrupt</button><button id="newThread">New thread</button><span class="hint">Ctrl+Enter sends</span></div></div></section><aside class="side"><div id="loginBox" class="login hidden"><strong>ChatGPT login required</strong><p class="hint">API-key billing is disabled by this harness.</p><div class="toolbar"><button id="browserLogin">Browser login</button><button id="deviceLogin">Device code</button></div><div id="loginDetails" class="hint"></div></div><h2>Turn settings</h2><div class="field"><label for="model">Model</label><select id="model"><option value="">Codex default</option></select></div><div class="field"><label for="effort">Reasoning effort</label><select id="effort"><option value="">Model default</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></div><div class="field"><label for="mode">Collaboration mode</label><select id="mode"><option value="default">Default</option><option value="plan">Plan</option></select></div><h2>Tools and integrations</h2><button id="loadCapabilities">Inspect capabilities</button><div id="capabilities">Loaded on request to keep startup light.</div><h2>Session</h2><div id="details"></div></aside></main><script>const qs=new URLSearchParams(location.search),token=qs.get('token')||'',el=id=>document.getElementById(id);let sequence=0,stopped=false,status={};async function api(path,options={}){const headers=Object.assign({'X-Harness-Token':token},options.headers||{});if(options.body)headers['Content-Type']='application/json';const response=await fetch(path,Object.assign({},options,{headers})),data=await response.json();if(!response.ok||data.error)throw new Error(data.error||response.statusText);return data}function text(value){return typeof value==='string'?value:JSON.stringify(value,null,2)}function addEvent(kind,payload,stamp){const box=document.createElement('div');box.className='event '+kind;const meta=document.createElement('div');meta.className='meta';meta.textContent=(stamp?new Date(stamp).toLocaleTimeString()+' · ':'')+kind;box.append(meta);const body=document.createElement('div');body.textContent=text(payload);box.append(body);el('stream').append(box);el('stream').scrollTop=el('stream').scrollHeight;return box}function addApproval(event){const payload=event.payload||{},box=addEvent('approval',{method:payload.method,params:payload.params},event.timestamp),actions=document.createElement('div');actions.className='approval-actions';[['Accept','accept'],['Accept for session','acceptForSession'],['Decline','decline'],['Cancel turn','cancel']].forEach(pair=>{const button=document.createElement('button');button.textContent=pair[0];if(pair[1]==='cancel')button.className='danger';button.onclick=async()=>{try{await api('/api/approval',{method:'POST',body:JSON.stringify({request_id:payload.request_id,decision:pair[1]})});actions.remove()}catch(error){addEvent('diagnostic',error.message)}};actions.append(button)});box.append(actions)}function handleEvent(event){sequence=Math.max(sequence,event.sequence||0);if(event.kind==='approval')addApproval(event);else addEvent(event.kind,event.payload,event.timestamp)}async function refreshStatus(){try{status=await api('/api/status');el('serverBadge').textContent=status.server_running?'app-server ready':'app-server stopped';el('serverBadge').className='badge '+(status.server_running?'ok':'bad');el('turnBadge').textContent=status.turn_running?'working':'idle';el('turnBadge').className='badge '+(status.turn_running?'ok':'');el('root').textContent=status.root||'';el('send').disabled=!!status.turn_running;el('interrupt').disabled=!status.turn_running;el('loginBox').classList.toggle('hidden',!!status.account);el('details').textContent=JSON.stringify({auth:status.account?status.account.type:null,plan:status.account?.plan_type||null,thread:status.thread_id||null,turn:status.turn_id||null,pid:status.pid||null},null,2)}catch(error){el('serverBadge').textContent=error.message;el('serverBadge').className='badge bad'}}async function eventLoop(){while(!stopped){try{const events=await api('/api/events?after='+sequence+'&wait=20');events.forEach(handleEvent);await refreshStatus()}catch(error){addEvent('diagnostic',error.message);await new Promise(resolve=>setTimeout(resolve,2000))}}}async function post(path,data={}){try{return await api(path,{method:'POST',body:JSON.stringify(data)})}catch(error){addEvent('diagnostic',error.message);throw error}}async function send(){const prompt=el('prompt').value.trim();if(!prompt)return;el('send').disabled=true;try{await post('/api/run',{prompt,model:el('model').value||null,effort:el('effort').value||null,mode:el('mode').value});el('prompt').value='';await refreshStatus()}catch(_error){el('send').disabled=false}}el('send').onclick=send;el('prompt').addEventListener('keydown',event=>{if(event.ctrlKey&&event.key==='Enter'){event.preventDefault();send()}});el('interrupt').onclick=()=>post('/api/interrupt').then(refreshStatus);el('newThread').onclick=()=>post('/api/new',{model:el('model').value||null}).then(refreshStatus);async function login(device_code){const result=await post('/api/login',{device_code}),url=result.authUrl||result.verificationUrl;el('loginDetails').textContent=result.userCode?'Code: '+result.userCode:'';if(url)window.open(url,'_blank','noopener')}el('browserLogin').onclick=()=>login(false);el('deviceLogin').onclick=()=>login(true);el('loadCapabilities').onclick=async()=>{el('capabilities').textContent='Loading…';try{const data=await api('/api/capabilities');el('capabilities').textContent=JSON.stringify(data,null,2);const models=data.models?.data||data.models?.models||[];models.forEach(item=>{const id=item.id||item.model;if(id&&!Array.from(el('model').options).some(option=>option.value===id)){const option=document.createElement('option');option.value=id;option.textContent=item.displayName||item.display_name||id;el('model').append(option)}})}catch(error){el('capabilities').textContent=error.message}};window.addEventListener('beforeunload',()=>{stopped=true});refreshStatus().then(eventLoop);</script></body></html>
