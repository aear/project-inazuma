<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Harness</title>
<style>
:root{color-scheme:dark;--bg:#101315;--panel:#191e21;--line:#30383d;--text:#e9edef;--muted:#9ba7ad;--accent:#64ddb1;--blue:#72adff;--warn:#f4c66b;--bad:#ff8178}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto auto 1fr}header{display:flex;gap:9px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}h1{font-size:15px;margin:0}.grow{flex:1}.badge{padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);white-space:nowrap}.ok{color:var(--accent)}.bad{color:var(--bad)}#workStatus{padding:8px 14px;border-bottom:1px solid var(--line);color:#cbd4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:10px;padding:10px}.console,.side{min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.console{display:grid;grid-template-rows:auto 1fr auto}#approvals{padding:8px 12px}.approval{border:2px solid var(--warn)!important;background:#292417!important}.hidden{display:none!important}#stream{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.event{padding:8px 10px;border-left:3px solid var(--line);background:#14181a;border-radius:4px;overflow-wrap:anywhere}.user{border-color:var(--blue)}.assistant{border-color:var(--accent)}.work_status{border-color:#b598ff}.diff{border-color:#ff9e64}.diagnostic{border-color:var(--bad)}.protocol{color:var(--muted);font-size:12px}.meta{font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:capitalize}.summary{white-space:pre-wrap}.raw{margin-top:7px;color:var(--muted);font:11px/1.4 monospace;white-space:pre-wrap;max-height:300px;overflow:auto}details summary{cursor:pointer;color:var(--muted);font-size:11px}.diff-details{margin-top:7px}.diff-code{margin-top:5px;padding:7px 0;background:#0d1012;border:1px solid var(--line);border-radius:4px;max-height:420px;overflow:auto;font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}.diff-line{display:block;padding:0 8px;min-width:max-content}.diff-add{color:#a9e8c8;background:#173329}.diff-del{color:#ffb4ad;background:#3a2021}.diff-hunk{color:#aebfff;background:#1d2638}.diff-file{color:#ffd198;font-weight:600;background:#30281c}.composer{padding:10px;border-top:1px solid var(--line)}textarea{width:100%;min-height:86px;resize:vertical;background:#101315;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit}.attachments{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.attachment{position:relative;width:88px;height:66px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#101315}.attachment img{width:100%;height:100%;object-fit:cover}.attachment button{position:absolute;right:2px;top:2px;padding:1px 5px;background:#101315cc}.controls,.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}button,select{background:#252b2f;color:var(--text);border:1px solid #3b454b;border-radius:5px;padding:7px 9px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#17694f;border-color:#2ba77e}button.danger{color:#ffbbb6}button:disabled{opacity:.45;cursor:not-allowed}.toggle{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}.side{overflow:auto;padding:11px}h2{font-size:12px;margin:14px 0 7px}.side h2:first-child{margin-top:0}.field{display:grid;gap:3px;margin-bottom:7px}.field label{font-size:11px;color:var(--muted)}.field select{width:100%}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.status-card{padding:7px;border:1px solid var(--line);border-radius:5px;min-width:0}.status-card small{display:block;color:var(--muted)}.status-card span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.login{padding:9px;border:1px solid var(--warn);border-radius:6px}.hint{color:var(--muted);font-size:12px}#threadPicker{width:100%}#capabilities{font:11px monospace;white-space:pre-wrap;color:var(--muted)}@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:minmax(480px,1fr) auto}.side{max-height:45vh}}
</style></head><body>
<header><h1>Codex operator console</h1><span id="serverBadge" class="badge">connecting</span><span id="turnBadge" class="badge">idle</span><span class="grow"></span><span id="root" class="hint"></span></header><div id="workStatus">Ready</div>
<main><section class="console"><div id="approvals" class="hidden"></div><div id="stream" aria-live="polite"></div><div class="composer"><textarea id="prompt" placeholder="Ask Codex to inspect, explain, or change this workspace… Paste screenshots here."></textarea><div id="attachments" class="attachments hidden"></div><input id="imagePicker" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><div class="controls"><button id="send" class="primary">Send</button><button id="attachImage">Attach image</button><button id="interrupt" class="danger">Interrupt</button><button id="newThread">New thread</button><label class="toggle"><input id="steering" type="checkbox" checked> Per-turn steering</label><span class="hint">Ctrl+Enter sends · up to 4 images, 8 MiB each</span></div></div></section>
<aside class="side"><div id="loginBox" class="login hidden"><strong>ChatGPT login required</strong><p class="hint">API-key billing is disabled.</p><div class="toolbar"><button id="browserLogin">Browser login</button><button id="deviceLogin">Device code</button></div><div id="loginDetails" class="hint"></div></div>
<h2>Session status</h2><div class="status-grid"><div class="status-card"><small>Git</small><span id="gitStatus">—</span></div><div class="status-card"><small>Diff</small><span id="diffStatus">—</span></div><div class="status-card"><small>Tests</small><span id="testStatus">—</span></div><div class="status-card"><small>Benchmarks</small><span id="benchStatus">—</span></div><div class="status-card"><small>Memory</small><span id="memoryStatus">—</span></div><div class="status-card"><small>Threads</small><span id="threadStatus">—</span></div></div>
<h2>Workspace threads</h2><div class="field"><label for="threadPicker">Recent threads (bounded to 50)</label><select id="threadPicker"><option value="">Load recent threads…</option></select></div><div class="toolbar"><button id="openThread">Open selected</button><button id="refreshThreads">Refresh</button></div>
<h2>Turn settings</h2><div class="field"><label for="model">Model</label><select id="model"><option value="">Codex default</option></select></div><div class="field"><label for="effort">Reasoning effort</label><select id="effort"><option value="">Model default</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option><option>ultra</option></select></div><div class="field"><label for="mode">Collaboration mode</label><select id="mode"><option value="default">Default</option><option value="plan">Plan</option></select></div><h2>Capabilities</h2><button id="loadCapabilities">Load on demand</button><div id="capabilities">Not loaded.</div></aside></main>
<script>
const qs=new URLSearchParams(location.search),token=qs.get('token')||'',el=id=>document.getElementById(id),MAX_DOM_EVENTS=240,MAX_IMAGES=4,MAX_IMAGE_BYTES=8*1024*1024,MAX_IMAGE_TOTAL_BYTES=16*1024*1024;
let sequence=0,stopped=false,status={},images=[];
async function api(path,options={}){const headers=Object.assign({'X-Harness-Token':token},options.headers||{});if(options.body)headers['Content-Type']='application/json';const response=await fetch(path,Object.assign({},options,{headers})),data=await response.json();if(!response.ok||data.error)throw new Error(data.error||response.statusText);return data}
function printable(value){return typeof value==='string'?value:JSON.stringify(value,null,2)}
function trimHistory(){const stream=el('stream');while(stream.children.length>MAX_DOM_EVENTS)stream.firstElementChild.remove()}
function appendDiff(box,payload){if(!payload.diff)return;const details=document.createElement('details'),label=document.createElement('summary'),code=document.createElement('div');details.className='diff-details';label.textContent='Show unified diff'+(payload.truncated?' (truncated)':'');code.className='diff-code';for(const line of payload.diff.split('\n')){const row=document.createElement('span');row.className='diff-line';if(line.startsWith('+++ ')||line.startsWith('--- ')||line.startsWith('diff --git '))row.classList.add('diff-file');else if(line.startsWith('+'))row.classList.add('diff-add');else if(line.startsWith('-'))row.classList.add('diff-del');else if(line.startsWith('@@'))row.classList.add('diff-hunk');row.textContent=line||' ';code.append(row)}details.append(label,code);box.append(details)}
function eventCard(kind,payload,stamp){payload=payload||{};const box=document.createElement('div');box.className='event '+kind;const meta=document.createElement('div');meta.className='meta';meta.textContent=(stamp?new Date(stamp).toLocaleTimeString()+' · ':'')+kind.replaceAll('_',' ');box.append(meta);const body=document.createElement('div');body.className='summary';body.textContent=printable(payload.summary??payload);box.append(body);if(kind==='diff')appendDiff(box,payload);if(payload.raw!==undefined){const details=document.createElement('details'),label=document.createElement('summary'),raw=document.createElement('div');label.textContent='Raw protocol details';raw.className='raw';raw.textContent=printable(payload.raw);details.append(label,raw);box.append(details)}el('stream').append(box);trimHistory();el('stream').scrollTop=el('stream').scrollHeight;return box}
function addApproval(event){const payload=event.payload||{},wrap=el('approvals');wrap.classList.remove('hidden');const box=eventCard('approval',{summary:'Approval required: '+payload.method,raw:payload.params},event.timestamp),actions=document.createElement('div');box.remove();wrap.append(box);actions.className='toolbar';[['Accept','accept'],['Accept for session','acceptForSession'],['Decline','decline'],['Cancel turn','cancel']].forEach(([label,decision])=>{const button=document.createElement('button');button.textContent=label;if(decision==='cancel')button.className='danger';button.onclick=async()=>{try{await api('/api/approval',{method:'POST',body:JSON.stringify({request_id:payload.request_id,decision})});box.remove();if(!wrap.children.length)wrap.classList.add('hidden')}catch(error){eventCard('diagnostic',{summary:error.message})}};actions.append(button)});box.append(actions)}
function handleEvent(event){sequence=Math.max(sequence,event.sequence||0);if(event.kind==='approval')addApproval(event);else eventCard(event.kind,event.payload,event.timestamp)}
async function refreshStatus(){try{status=await api('/api/status');el('serverBadge').textContent=status.server_running?'app-server ready':'app-server stopped';el('serverBadge').className='badge '+(status.server_running?'ok':'bad');el('turnBadge').textContent=status.turn_status||'idle';el('turnBadge').className='badge '+(status.turn_running?'ok':'');el('workStatus').textContent=status.work_status||'Ready';el('root').textContent=status.root||'';el('send').disabled=!!status.turn_running;el('interrupt').disabled=!status.turn_running;el('openThread').disabled=!!status.turn_running;el('loginBox').classList.toggle('hidden',!!status.account);el('gitStatus').textContent=status.git?.branch||'not a repository';el('diffStatus').textContent=status.diff||'—';el('testStatus').textContent=status.tests||'—';el('benchStatus').textContent=status.benchmarks||'—';el('memoryStatus').textContent=status.resources?.rss_mib==null?'unavailable':status.resources.rss_mib+' MiB';el('threadStatus').textContent=status.resources?.threads??'unavailable'}catch(error){el('serverBadge').textContent=error.message;el('serverBadge').className='badge bad'}}
async function eventLoop(){while(!stopped){try{(await api('/api/events?after='+sequence+'&wait=20')).forEach(handleEvent);await refreshStatus()}catch(error){eventCard('diagnostic',{summary:error.message});await new Promise(resolve=>setTimeout(resolve,2000))}}}
async function post(path,data={}){try{return await api(path,{method:'POST',body:JSON.stringify(data)})}catch(error){eventCard('diagnostic',{summary:error.message});throw error}}
function renderImages(){const wrap=el('attachments');wrap.textContent='';images.forEach((item,index)=>{const box=document.createElement('div'),preview=document.createElement('img'),remove=document.createElement('button');box.className='attachment';preview.src=item.url;preview.alt=item.name;remove.textContent='×';remove.title='Remove '+item.name;remove.onclick=()=>{images.splice(index,1);renderImages()};box.append(preview,remove);wrap.append(box)});wrap.classList.toggle('hidden',!images.length)}
async function addImages(files){for(const file of files){if(images.length>=MAX_IMAGES){eventCard('diagnostic',{summary:'At most '+MAX_IMAGES+' images may be attached.'});break}if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){eventCard('diagnostic',{summary:file.name+' is not a supported image.'});continue}if(!file.size||file.size>MAX_IMAGE_BYTES||images.reduce((sum,item)=>sum+item.size,0)+file.size>MAX_IMAGE_TOTAL_BYTES){eventCard('diagnostic',{summary:file.name+' exceeds the bounded image limits.'});continue}const url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)});images.push({name:file.name||'pasted image',size:file.size,url,detail:'auto'})}renderImages()}
async function send(){const prompt=el('prompt').value;if(!prompt.trim()&&!images.length)return;el('send').disabled=true;try{await post('/api/run',{prompt,images:images.map(({url,detail})=>({url,detail})),model:el('model').value||null,effort:el('effort').value||null,mode:el('mode').value,steering:el('steering').checked});el('prompt').value='';images=[];renderImages();await refreshStatus()}catch(_){el('send').disabled=false}}
async function refreshThreads(){try{const data=await api('/api/threads?limit=50'),picker=el('threadPicker');picker.textContent='';for(const thread of data.threads||[]){const option=document.createElement('option');option.value=thread.id;const rawTime=thread.updated_at,when=rawTime?new Date(typeof rawTime==='number'?rawTime*1000:rawTime).toLocaleString():'';option.textContent=(thread.name||'Untitled thread')+(when&&when!=='Invalid Date'?' · '+when:'');option.title=thread.preview||thread.name||'';option.selected=thread.id===data.current_thread_id;picker.append(option)}if(!picker.children.length){const option=document.createElement('option');option.value='';option.textContent='No workspace threads found';picker.append(option)}}catch(error){eventCard('diagnostic',{summary:error.message})}}
async function openThread(){const threadId=el('threadPicker').value;if(!threadId)return;try{const data=await post('/api/thread/resume',{thread_id:threadId});el('stream').textContent='';for(const item of data.transcript||[])eventCard(item.kind,{summary:item.summary});if(data.model)el('model').value=data.model;await refreshStatus()}catch(_){}}
el('send').onclick=send;el('attachImage').onclick=()=>el('imagePicker').click();el('imagePicker').onchange=event=>{addImages(event.target.files);event.target.value=''};el('prompt').addEventListener('paste',event=>{const pasted=Array.from(event.clipboardData?.files||[]).filter(file=>file.type.startsWith('image/'));if(pasted.length){event.preventDefault();addImages(pasted)}});el('prompt').addEventListener('keydown',event=>{if(event.ctrlKey&&event.key==='Enter'){event.preventDefault();send()}});el('interrupt').onclick=()=>post('/api/interrupt').then(refreshStatus);el('newThread').onclick=()=>post('/api/new',{model:el('model').value||null}).then(()=>{el('stream').textContent='';refreshThreads();refreshStatus()});el('refreshThreads').onclick=refreshThreads;el('openThread').onclick=openThread;
async function login(device_code){const result=await post('/api/login',{device_code}),url=result.authUrl||result.verificationUrl;el('loginDetails').textContent=result.userCode?'Code: '+result.userCode:'';if(url)window.open(url,'_blank','noopener')}el('browserLogin').onclick=()=>login(false);el('deviceLogin').onclick=()=>login(true);
el('loadCapabilities').onclick=async()=>{el('capabilities').textContent='Loading…';try{const data=await api('/api/capabilities');const counts={};for(const [key,value] of Object.entries(data))counts[key]=value?.data?.length??value?.items?.length??(value?.unavailable?'unavailable':'available');el('capabilities').textContent=Object.entries(counts).map(([key,value])=>key.replaceAll('_',' ')+': '+value).join('\n');const models=data.models?.data||data.models?.models||[];models.forEach(item=>{const id=item.id||item.model;if(id&&!Array.from(el('model').options).some(option=>option.value===id)){const option=document.createElement('option');option.value=id;option.textContent=item.displayName||item.display_name||id;el('model').append(option)}})}catch(error){el('capabilities').textContent=error.message}};
window.addEventListener('beforeunload',()=>{stopped=true});Promise.all([refreshStatus(),refreshThreads()]).then(eventLoop);
</script></body></html>
